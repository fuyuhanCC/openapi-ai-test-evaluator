name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Verify generated schemas
        run: |
          uv run oate plan schema --out /tmp/test-plan.schema.json
          uv run oate benchmark schema --out /tmp/benchmark-config.schema.json
          diff --unified schemas/test-plan.schema.json /tmp/test-plan.schema.json
          diff --unified schemas/benchmark-config.schema.json /tmp/benchmark-config.schema.json

      - name: Verify frozen benchmark integrity
        working-directory: benchmarks/demo_items/frozen/v5
        run: sha256sum --check SHA256SUMS

  benchmark-replay:
    name: Docker benchmark replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start benchmark services
        run: docker compose up --build --wait

      - name: Replay frozen benchmark
        run: >-
          uv run oate benchmark run
          --config benchmarks/demo_items/frozen/v5/benchmark.yaml
          --overwrite
          --json

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop benchmark services
        if: always()
        run: docker compose down
