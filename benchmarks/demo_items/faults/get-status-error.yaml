schema_version: "1.0"
fault_id: get-status-error
description: Return HTTP 500 for an otherwise successful item lookup.
category: status
matcher:
  method: GET
  path_regex: "^/items/[0-9]+$"
  response_statuses: [200]
  response_media_type: application/json
mutation:
  type: replace_status
  status_code: 500
